# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Deploy da API .NET como Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Build with dotnet
        run: dotnet build server/GeradorCertificadosOnline.slnx --configuration Release

      - name: dotnet publish
        run: dotnet publish server/src/Api/GeradorCertificadosOnline.Api.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  migrate:
    runs-on: windows-latest
    needs: build
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore dependencies
        working-directory: server
        run: dotnet restore src/Api/GeradorCertificadosOnline.Api.csproj

      - name: Restore tools
        working-directory: server
        run: dotnet tool restore

      - name: Apply ORM migrations to Neon (PostgreSQL)
        working-directory: server
        env:
          POSTGRES_CONNECTIONSTRING: ${{ secrets.POSTGRES_CONNECTIONSTRING }}
          ConnectionStrings__Postgres: ${{ secrets.POSTGRES_CONNECTIONSTRING }}
          ConnectionStrings__RabbitMq: ${{ secrets.RABBITMQ_CONNECTIONSTRING }}
          Jwt__SigningKey: ${{ secrets.JWT_SIGNING_KEY }}
          NewRelic__LicenseKey: ${{ secrets.NEWRELIC_LICENSE_KEY }}
        run: |
          dotnet ef database update `
            --project src/Infraestrutura/GeradorCertificadosOnline.Infraestrutura.csproj `
            --startup-project src/Api/GeradorCertificadosOnline.Api.csproj `
            --configuration Release `
            --connection "$env:POSTGRES_CONNECTIONSTRING"

  deploy:
    runs-on: windows-latest
    needs: [build, migrate]
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Azure Web App settings
        shell: pwsh
        run: |
          az webapp config appsettings set `
            --resource-group "rg-gerador-certificados" `
            --name "gerador-certificados-fullstack-app" `
            --settings `
              "ConnectionStrings__Postgres=${{ secrets.POSTGRES_CONNECTIONSTRING }}" `
              "ConnectionStrings__RabbitMq=${{ secrets.RABBITMQ_CONNECTIONSTRING }}" `
              "Cors__AllowedOrigins__0=https://jolly-flower-05873fe0f.3.azurestaticapps.net" `
              "Jwt__SigningKey=${{ secrets.JWT_SIGNING_KEY }}" `
              "NewRelic__LicenseKey=${{ secrets.NEWRELIC_LICENSE_KEY }}" `
              "LuckyPenny__LicenseKey=${{ secrets.LUCKYPENNY_LICENSE_KEY }}"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "gerador-certificados-fullstack-app"
          slot-name: "Production"
          package: .
