<header class="sticky top-0 z-50 border-b border-slate-200/80 bg-white/80 backdrop-blur-sm">
  <nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
    <a routerLink="/" class="flex items-center gap-2.5">
      <div
        class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-violet-500 to-cyan-400 text-sm font-bold text-slate-950"
      >
        cn
      </div>
      <span class="text-lg font-semibold tracking-tight text-slate-900">certnex</span>
    </a>

    <div class="flex items-center gap-4">
      @if (sessaoAutenticada() === null) {
        <a routerLink="/login" class="text-sm font-medium text-slate-600 hover:text-slate-900">Entrar</a>
        <a
          routerLink="/cadastro"
          class="rounded-lg bg-gradient-to-r from-violet-600 to-cyan-500 px-4 py-2 text-sm font-semibold text-white shadow-sm transition-all hover:shadow-md hover:brightness-110"
        >
          Começar agora
        </a>
      } @else {
        <a routerLink="/cursos" class="text-sm font-medium text-slate-600 hover:text-slate-900">
          Meus cursos
        </a>
        <span class="text-sm font-medium text-slate-600">
          {{ sessaoAutenticada()?.usuario.email }}
        </span>
        <button
          type="button"
          (click)="authService.encerrarSessao()"
          class="text-sm font-medium text-slate-600 hover:text-slate-900"
        >
          Sair
        </button>
      }
    </div>
  </nav>
</header>
