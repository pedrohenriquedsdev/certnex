@if (carregando()) {
  <div class="rounded-2xl border border-slate-200 bg-white p-10 text-center text-sm text-slate-500">
    Carregando curso...
  </div>
} @else if (mensagemErro()) {
  <p class="rounded-md border border-red-200 bg-red-50 px-3 py-1.5 text-sm text-red-600">
    {{ mensagemErro() }}
  </p>
} @else if (curso()) {
  <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
    <h1 class="text-2xl font-semibold text-slate-900">{{ curso()?.nome }}</h1>

    <dl class="mt-6 grid gap-6 sm:grid-cols-2">
      <div>
        <dt class="text-sm font-medium text-slate-500">Carga horária</dt>
        <dd class="mt-1 text-base text-slate-900">{{ curso()?.cargaHoraria }} horas</dd>
      </div>
      <div>
        <dt class="text-sm font-medium text-slate-500">Data de conclusão</dt>
        <dd class="mt-1 text-base text-slate-900">{{ formatarData(curso()!.dataConclusao) }}</dd>
      </div>
    </dl>

    <a
      [routerLink]="['/cursos/certificados', cursoId]"
      class="mt-6 inline-flex rounded-lg bg-gradient-to-r from-violet-600 to-cyan-500 px-4 py-2 text-sm font-semibold text-white shadow-sm transition-all hover:brightness-110"
    >
      Gerar certificados
    </a>
  </div>
}
